name: Update scores and publish site

on:
  schedule:
    - cron: "17 * * * *"      # every hour, at 17 minutes past
  workflow_dispatch:           # "Run workflow" button on the Actions tab
  push:
    branches: [main]           # republish when teams.json or the page changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy new rounds from the score form
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python3 scripts/update_scores.py

      - name: Save new rounds to the repo
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/scores.json
            git commit -m "Update scores"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
